    <script>
        const STORAGE_KEY = 'customResourceNavigation:v1';
        const BUILT_IN_THEME = {
            primary: { text: 'text-primary', hover: 'hover:bg-primary/5', header: 'gradient-bg' },
            green: { text: 'text-green-500', hover: 'hover:bg-green-50', header: 'bg-gradient-to-r from-green-500 to-teal-500' },
            purple: { text: 'text-purple-500', hover: 'hover:bg-purple-50', header: 'bg-gradient-to-r from-purple-500 to-pink-500' },
            blue: { text: 'text-blue-500', hover: 'hover:bg-blue-50', header: 'bg-gradient-to-r from-blue-500 to-teal-400' },
        };
        const CUSTOM_THEMES = [
            { id: 'sky', text: 'text-sky-500', hover: 'hover:bg-sky-50', header: 'bg-gradient-to-r from-sky-500 to-cyan-500' },
            { id: 'rose', text: 'text-rose-500', hover: 'hover:bg-rose-50', header: 'bg-gradient-to-r from-rose-500 to-orange-400' },
            { id: 'amber', text: 'text-amber-600', hover: 'hover:bg-amber-50', header: 'bg-gradient-to-r from-amber-500 to-yellow-400' },
            { id: 'emerald', text: 'text-emerald-500', hover: 'hover:bg-emerald-50', header: 'bg-gradient-to-r from-emerald-500 to-lime-500' },
            { id: 'indigo', text: 'text-indigo-500', hover: 'hover:bg-indigo-50', header: 'bg-gradient-to-r from-indigo-500 to-violet-500' },
            { id: 'slate', text: 'text-slate-600', hover: 'hover:bg-slate-50', header: 'bg-gradient-to-r from-slate-700 to-gray-500' },
        ];
        const THEME_MAP = CUSTOM_THEMES.reduce((themes, theme) => {
            themes[theme.id] = theme;
            return themes;
        }, { ...BUILT_IN_THEME });

        let state = { modules: [], sites: {} };
        let cardObserver = null;
        let toastTimer = null;
        let lastFocusedElement = null;

        document.addEventListener('DOMContentLoaded', () => {
            state = loadState();
            renderCustomModules();
            renderSavedSites();
            setupCardAnimation();
            populateModuleSelect();
            bindEvents();
        });

        function loadState() {
            const fallback = { modules: [], sites: {} };

            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!saved || typeof saved !== 'object') {
                    return fallback;
                }

                const modules = Array.isArray(saved.modules)
                    ? saved.modules.filter(module => module && module.id && module.name)
                    : [];
                const sites = saved.sites && typeof saved.sites === 'object' ? saved.sites : {};

                Object.keys(sites).forEach(moduleId => {
                    sites[moduleId] = Array.isArray(sites[moduleId])
                        ? sites[moduleId].filter(site => site && site.id && site.name && site.url)
                        : [];
                });

                return { modules, sites };
            } catch (error) {
                return fallback;
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function bindEvents() {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const targetId = this.getAttribute('href');
                    if (targetId !== '#') {
                        e.preventDefault();
                        document.querySelector(targetId)?.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            document.getElementById('openModuleModal').addEventListener('click', () => openModal('module'));
            document.getElementById('openSiteModal').addEventListener('click', () => openModal('site'));
            document.getElementById('closeModalButton').addEventListener('click', closeModal);
            document.getElementById('siteUrl').addEventListener('input', event => {
                if (!event.target.value.trim()) {
                    resetUrlValidation();
                    return;
                }

                setUrlValidation(validateUrl(event.target.value), true);
            });
            document.getElementById('siteUrl').addEventListener('blur', event => {
                if (event.target.value.trim()) {
                    setUrlValidation(validateUrl(event.target.value), true);
                }
            });
            document.getElementById('modalBackdrop').addEventListener('click', event => {
                if (event.target.id === 'modalBackdrop') {
                    closeModal();
                }
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && !document.getElementById('modalBackdrop').classList.contains('hidden')) {
                    closeModal();
                }
            });

            document.getElementById('navGrid').addEventListener('click', event => {
                const addButton = event.target.closest('.add-site-button');
                const deleteSiteButton = event.target.closest('[data-delete-site-id]');
                const deleteModuleButton = event.target.closest('[data-delete-module-id]');

                if (addButton) {
                    openModal('site', addButton.dataset.moduleId);
                    return;
                }

                if (deleteSiteButton) {
                    deleteSite(deleteSiteButton.dataset.moduleId, deleteSiteButton.dataset.deleteSiteId);
                    return;
                }

                if (deleteModuleButton) {
                    deleteModule(deleteModuleButton.dataset.deleteModuleId);
                }
            });

            document.getElementById('moduleForm').addEventListener('submit', event => {
                event.preventDefault();
                const name = document.getElementById('moduleName').value.trim();
                const icon = document.getElementById('moduleIcon').value;
                const message = document.getElementById('moduleMessage');

                if (!name) {
                    showMessage(message, '请输入模块名称');
                    return;
                }

                const module = {
                    id: createId('module'),
                    name,
                    icon,
                    theme: CUSTOM_THEMES[state.modules.length % CUSTOM_THEMES.length].id,
                };

                state.modules.push(module);
                state.sites[module.id] = [];
                saveState();
                renderCustomModule(module);
                populateModuleSelect(module.id);
                closeModal();
                showToast('模块已添加');
            });

            document.getElementById('siteForm').addEventListener('submit', event => {
                event.preventDefault();
                const moduleId = document.getElementById('moduleSelect').value;
                const name = document.getElementById('siteName').value.trim();
                const urlValidation = validateUrl(document.getElementById('siteUrl').value);
                const message = document.getElementById('siteMessage');

                if (!moduleId) {
                    showMessage(message, '请选择所属模块');
                    return;
                }

                if (!name) {
                    showMessage(message, '请输入网址名称');
                    return;
                }

                if (!urlValidation.ok) {
                    setUrlValidation(urlValidation);
                    document.getElementById('siteUrl').focus();
                    return;
                }

                const site = {
                    id: createId('site'),
                    name,
                    url: urlValidation.url,
                };

                state.sites[moduleId] = state.sites[moduleId] || [];
                state.sites[moduleId].push(site);
                saveState();
                renderSavedSitesForModule(moduleId);
                closeModal();
                showToast('网站已添加');
            });
        }

        function openModal(mode, moduleId = '') {
            lastFocusedElement = document.activeElement;
            clearMessages();

            const backdrop = document.getElementById('modalBackdrop');
            const title = document.getElementById('modalTitle');
            const moduleForm = document.getElementById('moduleForm');
            const siteForm = document.getElementById('siteForm');

            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
            document.body.classList.add('overflow-hidden');

            if (mode === 'module') {
                title.textContent = '添加模块';
                siteForm.classList.add('hidden');
                moduleForm.classList.remove('hidden');
                moduleForm.reset();
                setTimeout(() => document.getElementById('moduleName').focus(), 0);
                return;
            }

            title.textContent = '添加网站';
            moduleForm.classList.add('hidden');
            siteForm.classList.remove('hidden');
            siteForm.reset();
            populateModuleSelect(moduleId);
            setTimeout(() => document.getElementById('siteName').focus(), 0);
        }

        function closeModal() {
            const backdrop = document.getElementById('modalBackdrop');
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
            lastFocusedElement?.focus?.();
        }

        function populateModuleSelect(selectedId = '') {
            const select = document.getElementById('moduleSelect');
            select.innerHTML = '';

            getModuleSections().forEach(section => {
                const option = document.createElement('option');
                option.value = section.dataset.moduleId;
                option.textContent = section.dataset.moduleTitle;
                select.appendChild(option);
            });

            if (selectedId && [...select.options].some(option => option.value === selectedId)) {
                select.value = selectedId;
            }
        }

        function renderCustomModules() {
            state.modules.forEach(module => {
                if (!getModuleSection(module.id)) {
                    renderCustomModule(module);
                }
            });
        }

        function renderCustomModule(module) {
            const theme = getTheme(module.theme);
            const section = document.createElement('section');
            section.className = 'card-hover bg-white rounded-xl shadow-md overflow-hidden';
            section.dataset.moduleId = module.id;
            section.dataset.moduleTitle = module.name;
            section.dataset.theme = module.theme;

            const header = document.createElement('div');
            header.className = `${theme.header} p-3 text-white flex items-center justify-between gap-3`;

            const title = document.createElement('h2');
            title.className = 'min-w-0 text-lg font-bold flex items-center';

            const icon = document.createElement('i');
            icon.className = `fa-solid ${module.icon || 'fa-folder'} mr-2 shrink-0`;

            const titleText = document.createElement('span');
            titleText.className = 'truncate';
            titleText.textContent = module.name;

            const actions = document.createElement('div');
            actions.className = 'flex shrink-0 items-center gap-1';

            const addButton = createHeaderButton('fa-plus', '添加网站');
            addButton.classList.add('add-site-button');
            addButton.dataset.moduleId = module.id;

            const deleteButton = createHeaderButton('fa-trash', '删除模块');
            deleteButton.dataset.deleteModuleId = module.id;

            const links = document.createElement('div');
            links.className = 'link-list p-3 space-y-1';

            title.append(icon, titleText);
            actions.append(addButton, deleteButton);
            header.append(title, actions);
            section.append(header, links);
            document.getElementById('navGrid').appendChild(section);

            if (cardObserver) {
                applyCardAnimation(section);
            }
        }

        function createHeaderButton(iconClass, label) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'flex h-8 w-8 items-center justify-center rounded-full bg-white/15 text-white transition hover:bg-white/25';
            button.title = label;
            button.setAttribute('aria-label', label);

            const icon = document.createElement('i');
            icon.className = `fa-solid ${iconClass} text-sm`;
            button.appendChild(icon);

            return button;
        }

        function renderSavedSites() {
            getModuleSections().forEach(section => renderSavedSitesForModule(section.dataset.moduleId));
        }

        function renderSavedSitesForModule(moduleId) {
            const section = getModuleSection(moduleId);
            const links = section?.querySelector('.link-list');
            if (!links) {
                return;
            }

            links.querySelectorAll('.custom-site').forEach(site => site.remove());
            (state.sites[moduleId] || []).forEach(site => {
                links.appendChild(createSiteItem(site, moduleId, getTheme(section.dataset.theme)));
            });
        }

        function createSiteItem(site, moduleId, theme) {
            const wrapper = document.createElement('div');
            wrapper.className = `custom-site group flex items-center rounded-lg ${theme.hover} transition-colors`;
            wrapper.dataset.customSiteId = site.id;

            const link = document.createElement('a');
            link.href = site.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'flex min-w-0 flex-1 items-center p-2 text-sm';

            const icon = document.createElement('i');
            icon.className = `fa-solid fa-link ${theme.text} w-5 shrink-0`;

            const label = document.createElement('span');
            label.className = 'ml-2 truncate';
            label.textContent = site.name;

            const externalIcon = document.createElement('i');
            externalIcon.className = 'fa-solid fa-arrow-up-right-from-square ml-2 text-[10px] text-gray-300';

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'mr-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-gray-300 transition hover:bg-red-50 hover:text-red-500 sm:opacity-0 sm:group-hover:opacity-100';
            deleteButton.title = '删除网站';
            deleteButton.setAttribute('aria-label', '删除网站');
            deleteButton.dataset.moduleId = moduleId;
            deleteButton.dataset.deleteSiteId = site.id;
            deleteButton.innerHTML = '<i class="fa-solid fa-trash text-xs"></i>';

            link.append(icon, label, externalIcon);
            wrapper.append(link, deleteButton);

            return wrapper;
        }

        function deleteSite(moduleId, siteId) {
            state.sites[moduleId] = (state.sites[moduleId] || []).filter(site => site.id !== siteId);
            saveState();
            renderSavedSitesForModule(moduleId);
            showToast('网站已删除');
        }

        function deleteModule(moduleId) {
            const module = state.modules.find(item => item.id === moduleId);
            if (!module || !confirm('删除模块会同时删除其中添加的网站，确定删除吗？')) {
                return;
            }

            state.modules = state.modules.filter(item => item.id !== moduleId);
            delete state.sites[moduleId];
            saveState();
            getModuleSection(moduleId)?.remove();
            populateModuleSelect();
            showToast('模块已删除');
        }

        function getModuleSections() {
            return [...document.querySelectorAll('[data-module-id]')];
        }

        function getModuleSection(moduleId) {
            return getModuleSections().find(section => section.dataset.moduleId === moduleId);
        }

        function getTheme(themeId) {
            return THEME_MAP[themeId] || BUILT_IN_THEME.primary;
        }

        function validateUrl(value) {
            const rawValue = value.trim();

            if (!rawValue) {
                return { ok: false, url: '', message: '请输入网址' };
            }

            if (/\s/.test(rawValue)) {
                return { ok: false, url: '', message: '网址不能包含空格' };
            }

            if (/^[a-z][a-z\d+\-.]*:/i.test(rawValue) && !/^https?:\/\//i.test(rawValue)) {
                return { ok: false, url: '', message: '网址只支持 http:// 或 https:// 开头' };
            }

            const urlText = /^https?:\/\//i.test(rawValue) ? rawValue : `https://${rawValue}`;

            try {
                const url = new URL(urlText);
                const allowedProtocol = url.protocol === 'http:' || url.protocol === 'https:';

                if (!allowedProtocol) {
                    return { ok: false, url: '', message: '网址只支持 http:// 或 https://' };
                }

                if (!url.hostname) {
                    return { ok: false, url: '', message: '网址缺少域名或 IP 地址' };
                }

                const hostname = url.hostname.replace(/\.$/, '').toLowerCase();

                if (hostname.length > 253) {
                    return { ok: false, url: '', message: '网址域名过长' };
                }

                if (!isValidUrlHostname(hostname)) {
                    return { ok: false, url: '', message: '请输入完整域名、localhost 或 IP 地址' };
                }

                return { ok: true, url: url.href, message: '网址格式正确' };
            } catch (error) {
                return { ok: false, url: '', message: '请输入正确的网址，例如：https://www.baidu.com' };
            }
        }

        function isValidUrlHostname(hostname) {
            if (hostname === 'localhost' || isValidIpv4(hostname)) {
                return true;
            }

            if (hostname.includes(':')) {
                return true;
            }

            const labels = hostname.split('.');
            if (labels.length < 2) {
                return false;
            }

            return labels.every(label => {
                return label.length > 0
                    && label.length <= 63
                    && /^[a-z0-9-]+$/i.test(label)
                    && !label.startsWith('-')
                    && !label.endsWith('-');
            });
        }

        function isValidIpv4(hostname) {
            const parts = hostname.split('.');
            return parts.length === 4 && parts.every(part => {
                const number = Number(part);
                return /^\d{1,3}$/.test(part) && number >= 0 && number <= 255;
            });
        }

        function normalizeUrl(value) {
            const validation = validateUrl(value);
            return validation.ok ? validation.url : '';
        }

        function createId(prefix) {
            return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        }

        function showMessage(element, text, type = 'error') {
            element.textContent = text;
            element.classList.toggle('bg-red-50', type === 'error');
            element.classList.toggle('text-red-600', type === 'error');
            element.classList.toggle('bg-green-50', type === 'success');
            element.classList.toggle('text-green-700', type === 'success');
            element.classList.remove('hidden');
        }

        function clearMessages() {
            document.querySelectorAll('#moduleMessage, #siteMessage').forEach(message => {
                message.textContent = '';
                message.classList.add('hidden');
            });
            resetUrlValidation();
        }

        function setUrlValidation(validation, allowSuccessMessage = false) {
            const input = document.getElementById('siteUrl');
            const message = document.getElementById('siteMessage');

            input.setAttribute('aria-invalid', validation.ok ? 'false' : 'true');
            input.classList.remove('border-red-300', 'focus:border-red-500', 'focus:ring-red-100', 'border-green-300', 'focus:border-green-500', 'focus:ring-green-100');

            if (validation.ok) {
                input.classList.add('border-green-300', 'focus:border-green-500', 'focus:ring-green-100');

                if (allowSuccessMessage) {
                    showMessage(message, validation.message, 'success');
                } else {
                    message.classList.add('hidden');
                }
                return;
            }

            input.classList.add('border-red-300', 'focus:border-red-500', 'focus:ring-red-100');
            showMessage(message, validation.message, 'error');
        }

        function resetUrlValidation() {
            const input = document.getElementById('siteUrl');
            const message = document.getElementById('siteMessage');

            input.setAttribute('aria-invalid', 'false');
            input.classList.remove('border-red-300', 'focus:border-red-500', 'focus:ring-red-100', 'border-green-300', 'focus:border-green-500', 'focus:ring-green-100');
            message.classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.classList.remove('hidden');
            toastTimer = setTimeout(() => toast.classList.add('hidden'), 1800);
        }

        function setupCardAnimation() {
            if ('IntersectionObserver' in window) {
                cardObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('opacity-100', 'translate-y-0');
                            entry.target.classList.remove('opacity-0', 'translate-y-4');
                        }
                    });
                }, { threshold: 0.1 });
            }

            document.querySelectorAll('.card-hover').forEach(applyCardAnimation);
        }

        function applyCardAnimation(card) {
            card.classList.add('opacity-0', 'translate-y-4', 'transition-all', 'duration-500');

            if (cardObserver) {
                cardObserver.observe(card);
                return;
            }

            card.classList.add('opacity-100', 'translate-y-0');
            card.classList.remove('opacity-0', 'translate-y-4');
        }
    </script>
</body>
